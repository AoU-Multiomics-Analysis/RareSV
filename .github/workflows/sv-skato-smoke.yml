name: RareSV published image check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      IMAGE: docker.io/epadhi/raresv:workbench-follow-up-a29862b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check WDL validation and localization
        run: |
          python3 -m pip install miniwdl==1.14.2
          miniwdl check wdl/sv_skato.wdl
          python3 tests/test_sv_skato_wdl.py
      - name: Run the single-variant follow-up regression against the published image
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}'
          docker run --rm --network none --entrypoint /bin/bash "$IMAGE" -c             'test "$(id -u)" = 0 && test "$PWD" = /work'
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint /bin/bash "$IMAGE" -c '
            set -euo pipefail
            cmp R/sv_pgen_workflow.R /opt/sv-skato/sv_pgen_workflow.R
            cmp R/sv_set_tests.R /opt/sv-skato/sv_set_tests.R
            Rscript /opt/sv-skato/sv_pgen_workflow.R scan --help | grep -- --significant-genes
            Rscript tests/test_sv_set_tests.R
            Rscript tests/test_sv_pgen_workflow.R
            Rscript tests/smoke_sv_pgen_workflow.R
          '
