name: SV SKAT-O image

on:
  push:
    branches:
      - main
    paths:
      - R/sv_set_tests.R
      - R/sv_pgen_workflow.R
  pull_request:
    paths:
      - R/sv_set_tests.R
      - R/sv_pgen_workflow.R
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check WDL syntax and localization
        run: |
          python3 -m pip install miniwdl==1.14.2
          miniwdl check wdl/sv_skato.wdl
          python3 tests/test_sv_skato_wdl.py
      - name: Build the analysis image
        run: |
          docker build -f docker/sv-skato/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t sv-skato:smoke .
      - name: Run synthetic PLINK and SKAT-O checks
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo sv-skato:smoke Rscript tests/test_sv_pgen_workflow.R
          docker run --rm -v "$PWD:/repo:ro" -w /repo sv-skato:smoke Rscript tests/smoke_sv_pgen_workflow.R
      - name: Publish the tested image to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag sv-skato:smoke "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          printf 'Published %s\n' "$image:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
