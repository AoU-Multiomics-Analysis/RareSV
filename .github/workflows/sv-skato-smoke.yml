name: RareSV Workbench image check

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      WORKBENCH_BASE: mirror.gcr.io/epadhi/raresv@sha256:830093336461af096586a30db2360104c14fe472ec1c9b1fc2027840ac95565c
      PACKAGE_IMAGE: ghcr.io/aou-multiomics-analysis/raresv@sha256:0226b669dff56ecbb4a22136819e05b10be06a6c7393a33266cc22e109687a90
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Add the pinned R packages to the Workbench base
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          asset=go-containerregistry_Linux_x86_64.tar.gz
          gh release download v0.22.1 --repo google/go-containerregistry --pattern "$asset" --pattern checksums.txt --dir "$work"
          (cd "$work"; awk -v asset="$asset" '$2 == asset { print }' checksums.txt > selected-checksums; test -s selected-checksums; sha256sum -c selected-checksums)
          tar -xzf "$work/$asset" -C "$work" crane
          crane="$work/crane"
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$PACKAGE_IMAGE"
          container=$(docker create "$PACKAGE_IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          library=opt/conda/lib/R/library
          mkdir -p "$work/overlay/$library"
          for package in R.methodsS3 R.oo R.utils; do
            docker cp --follow-link "$container:/$library/$package" "$work/overlay/$library/"
          done
          tar -C "$work/overlay" --owner=0 --group=0 -czf "$work/overlay.tar.gz" "$library/R.methodsS3" "$library/R.oo" "$library/R.utils"

          candidate="ghcr.io/${GITHUB_REPOSITORY,,}:workbench-$GITHUB_SHA"
          "$crane" append --base "$WORKBENCH_BASE" --new_layer "$work/overlay.tar.gz" --new_tag "$candidate"
          candidate="${candidate%:*}@$("$crane" digest "$candidate")"

          "$crane" manifest "$WORKBENCH_BASE" > "$work/base-manifest.json"
          "$crane" manifest "$candidate" > "$work/candidate-manifest.json"
          jq -es '.[0] as $base | .[1] as $new |
            $base.mediaType == $new.mediaType and
            $new.layers[0:-1] == $base.layers and
            ($new.layers | length) == (($base.layers | length) + 1)' "$work/base-manifest.json" "$work/candidate-manifest.json"
          "$crane" config "$WORKBENCH_BASE" > "$work/base-config.json"
          "$crane" config "$candidate" > "$work/candidate-config.json"
          jq -es '.[0] as $base | .[1] as $new |
            $base.config == $new.config and $base.os == $new.os and
            $base.architecture == $new.architecture' "$work/base-config.json" "$work/candidate-config.json"
          printf 'CANDIDATE=%s\n' "$candidate" >> "$GITHUB_ENV"
      - name: Test Workbench-style startup and compressed LoF input
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/bash "$CANDIDATE" -c '
            test "$(id -u)" = 0 &&
            test "$PWD" = /work &&
            printf "21\n" | awk "NF { print; found = 1 } END { exit !found }"
          '
          docker run --rm --network none --entrypoint /usr/bin/env "$CANDIDATE" \
            Rscript -e 'stopifnot(packageVersion("R.utils") == "2.13.0", packageVersion("R.oo") == "1.27.1", packageVersion("R.methodsS3") == "1.8.2")'
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint /bin/bash "$CANDIDATE" \
            -c 'Rscript tests/smoke_sv_pgen_workflow.R'
          printf 'Tested %s\n' "$CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
